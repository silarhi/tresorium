name: CI

# Le déploiement est géré par l'intégration git Vercel (auto-deploy sur push main,
# previews sur PR) — ce workflow ne fait que valider le code.

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - name: Lint (Biome)
              run: npx biome ci .

            - name: Build
              run: yarn build
